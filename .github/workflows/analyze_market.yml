name: Analyze Market

on:
  workflow_dispatch:
  push:
    paths:
      - "data/processed/seoul/**"
      - "src/analysis/market_structure.py"
      - "src/analysis/consumer_context.py"

jobs:
  analyze-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          python -m src.cleaning.validate_seoul
          python -m src.analysis.market_structure
          python -m src.analysis.consumer_context
          pytest -v tests/test_market_metrics.py
      - uses: actions/upload-artifact@v4
        with:
          name: market-analysis-outputs-${{ github.run_id }}
          path: outputs/tables/seoul_*

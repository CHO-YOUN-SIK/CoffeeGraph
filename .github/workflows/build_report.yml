name: Build Report

on:
  workflow_dispatch:
  push:
    paths:
      - "src/analysis/**"
      - "src/reporting/**"
      - "src/visualization/**"

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          python -m src.cleaning.validate_seoul
          python -m src.analysis.market_structure
          python -m src.analysis.consumer_context
          python -m src.analysis.market_external_validation
          python -m src.analysis.cqi_quality
          python -m src.analysis.brand_positioning
          python -m src.analysis.flavor_language
          python -m src.analysis.cross_analysis
          python -m src.analysis.value_space
          python -m src.analysis.consumer_value_evidence
          python -m src.visualization.market_cqi_charts
          python -m src.visualization.market_validation_map
          python -m src.visualization.opportunity_map
          python -m src.visualization.flavor_language_map
          python -m src.visualization.value_space_3d
          python -m src.visualization.value_constellation_3d
          python -m src.reporting.build_reports
          python -m src.reporting.build_flavor_report
          pytest -v
      - uses: actions/upload-artifact@v4
        with:
          name: research-reports-${{ github.run_id }}
          path: |
            outputs/reports/
            outputs/figures/
            outputs/tables/
            research/evidence/evidence_ledger.csv

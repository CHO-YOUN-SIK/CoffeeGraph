name: Data Validation

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Run official data validation
        run: |
          python -m src.cleaning.validate_seoul

      - name: Run pytest suite
        run: |
          pytest -v

      - name: Record run provenance
        if: always()
        run: |
          echo "Commit SHA: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "Run UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          cat data/metadata/validation_results.json >> $GITHUB_STEP_SUMMARY || true

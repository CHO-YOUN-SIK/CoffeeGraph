name: Analyze CQI

on:
  workflow_dispatch:
  push:
    paths:
      - "data/raw/cqi/**"
      - "src/analysis/cqi_quality.py"

jobs:
  analyze-cqi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          python -m src.cleaning.validate_seoul
          echo "CQI analysis ready for Phase 4 (M4)."

name: Analyze CQI

on:
  workflow_dispatch:
  push:
    paths:
      - "data/raw/cqi/**"
      - "src/analysis/cqi_quality.py"

jobs:
  analyze-cqi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
          python -m src.cleaning.validate_seoul
          python -m src.analysis.cqi_quality
          pytest -v tests/test_cqi_metrics.py
      - uses: actions/upload-artifact@v4
        with:
          name: cqi-analysis-outputs-${{ github.run_id }}
          path: outputs/tables/cqi_*

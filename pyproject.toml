[project]
name = "coffee-opportunity-research"
version = "0.1.0"
description = "Coffee Brand Opportunity Map: GitHub Cloud-based Data Research & BX/CX Strategy Analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "tabulate>=0.9.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
